name: Release RoboForge Desktop

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-bundles:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-14'
            args: '--target aarch64-apple-darwin'
            bundle-path: 'apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg'
            artifact-name: 'roboforge-macos-aarch64'
          - platform: 'macos-13'
            args: '--target x86_64-apple-darwin'
            bundle-path: 'apps/desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg'
            artifact-name: 'roboforge-macos-x86_64'
          - platform: 'ubuntu-22.04'
            args: ''
            bundle-path: 'apps/desktop/src-tauri/target/release/bundle/*/*'
            artifact-name: 'roboforge-linux'
          - platform: 'windows-latest'
            args: ''
            bundle-path: 'apps/desktop/src-tauri/target/release/bundle/*/*'
            artifact-name: 'roboforge-windows'
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-14' && 'aarch64-apple-darwin' || matrix.platform == 'macos-13' && 'x86_64-apple-darwin' || '' }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run verification checks
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm content:check

      - name: Build content bundle
        run: pnpm content:build

      - name: Build Tauri desktop application
        run: pnpm --filter @roboforge/desktop tauri build ${{ matrix.args }}

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.bundle-path }}
          if-no-files-found: warn

  publish-release:
    name: Publish GitHub Release
    needs: build-bundles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        working-directory: release-assets
        run: |
          find . -maxdepth 1 -type f -exec sha256sum {} + | sort -k 2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
