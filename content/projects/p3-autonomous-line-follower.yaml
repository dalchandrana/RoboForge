steps:
  - step: 1
    title: "Assemble the Mechanical Chassis"
    description: "Bolt the two yellow TT gearmotors into the chassis brackets using the long M3 screws. Attach the rubber wheels to the dual output axles. Fasten the front omnidirectional caster wheel."
    check: "Chassis rests stably on 2 drive wheels and 1 front caster."
  - step: 2
    title: "Mount Sensors on the Underside"
    description: "Secure the two TCRT5000 IR sensor modules pointing downward toward the ground, approximately 5mm to 10mm above the floor surface, spaced roughly 2cm apart (straddling a standard 3/4 inch black electrical tape line)."
    check: "Both sensor IR LEDs face down with clear line of sight to the floor."
  - step: 3
    title: "Wire the Motors to L298N Out Terminals"
    description: "Connect Left motor pair wires to OUT1 & OUT2 screw terminals. Connect Right motor pair wires to OUT3 & OUT4 screw terminals."
    check: "Screws tightened firmly with no stray copper whiskers."
  - step: 4
    title: "Complete Power & Common Ground Wiring"
    description: "Connect the battery positive wire to L298N 12V terminal. Connect battery negative to L298N GND terminal. Run a jumper wire from L298N GND directly to an Arduino GND pin."
    check: "CRITICAL CHECK: L298N GND and Arduino GND are electrically connected!"
  - step: 5
    title: "Connect Logic Signals to Arduino"
    description: "Route jumpers from Arduino pins 5, 6, 9, 10 to L298N IN1, IN2, IN3, IN4. Connect Left IR sensor DO to Pin 2, Right IR sensor DO to Pin 3."
    check: "All 6 control signal jumpers verified against wiring table."
  - step: 6
    title: "Calibrate Sensitivity and Track"
    description: "Place robot over white paper with black tape line. Turn onboard potentiometer on each TCRT5000 until the onboard sensor indicator LED turns ON only over the black tape and OFF over white paper."
    check: "Sensor LEDs respond crisply when sliding robot across the tape."
code:
  language: "cpp"
  source: |
    // RoboForge Project 3: Autonomous Dual-Sensor Line-Following Robot
    // Two-sensor Bang-Bang / Differential Steer Algorithm

    // Left Motor Pins (L298N IN1, IN2)
    const int L_FWD = 5;
    const int L_REV = 6;

    // Right Motor Pins (L298N IN3, IN4)
    const int R_FWD = 9;
    const int R_REV = 10;

    // Line Sensor Pins
    const int SENSOR_LEFT = 2;
    const int SENSOR_RIGHT = 3;

    // Base speed (0-255 PWM duty cycle)
    const int SPEED_FWD = 160;
    const int SPEED_TURN = 140;

    void setLeftMotor(int speed) {
      if (speed >= 0) {
        analogWrite(L_FWD, speed);
        analogWrite(L_REV, 0);
      } else {
        analogWrite(L_FWD, 0);
        analogWrite(L_REV, -speed);
      }
    }

    void setRightMotor(int speed) {
      if (speed >= 0) {
        analogWrite(R_FWD, speed);
        analogWrite(R_REV, 0);
      } else {
        analogWrite(R_FWD, 0);
        analogWrite(R_REV, -speed);
      }
    }

    void setup() {
      pinMode(L_FWD, OUTPUT);
      pinMode(L_REV, OUTPUT);
      pinMode(R_FWD, OUTPUT);
      pinMode(R_REV, OUTPUT);

      pinMode(SENSOR_LEFT, INPUT);
      pinMode(SENSOR_RIGHT, INPUT);
    }

    void loop() {
      // TCRT5000: HIGH = Black line detected, LOW = White floor
      int leftDetect = digitalRead(SENSOR_LEFT);
      int rightDetect = digitalRead(SENSOR_RIGHT);

      if (leftDetect == LOW && rightDetect == LOW) {
        // Line is centered between the two sensors: DRIVE FORWARD
        setLeftMotor(SPEED_FWD);
        setRightMotor(SPEED_FWD);
      } 
      else if (leftDetect == HIGH && rightDetect == LOW) {
        // Robot is veering right: TURN SHARP LEFT
        setLeftMotor(0);
        setRightMotor(SPEED_TURN);
      } 
      else if (leftDetect == LOW && rightDetect == HIGH) {
        // Robot is veering left: TURN SHARP RIGHT
        setLeftMotor(SPEED_TURN);
        setRightMotor(0);
      } 
      else {
        // Both detected black (intersection or T-junction): STOP or crawl
        setLeftMotor(SPEED_FWD / 2);
        setRightMotor(SPEED_FWD / 2);
      }
    }
  explanation: "Differential steering controls the trajectory: turning left requires stopping or slowing the left motor while driving the right motor, creating a pivot turn around the left wheel."
testChecklist:
  - "With wheels elevated in the air, testing sensors by hand spins the correct opposing wheel."
  - "On a test oval track made with 3/4 inch black electrical tape on white poster board, robot completes full laps autonomously."
  - "Robot successfully negotiates 90-degree curved turns without losing the track line."
troubleshooting:
  - symptom: "Motors hum or buzz loudly but wheels do not rotate"
    cause: "PWM speed value is too low to overcome gearbox static friction, or battery voltage has dropped below 4.5V."
    remedy: "Increase SPEED_FWD from 160 to 200 in the code, or insert fresh AA batteries."
  - symptom: "Robot drives backward instead of forward"
    cause: "Motor polarity reversed on the L298N OUT screw terminals."
    remedy: "Swap the two wires connected to OUT1 & OUT2 (or OUT3 & OUT4) on the screw terminal block."
  - symptom: "Robot shakes erratically back and forth on the line and never moves forward"
    cause: "Sensors are mounted too close together or steering reaction is inverted (turning into the line rather than away)."
    remedy: "Widen sensor spacing slightly and verify left sensor steers left, not right."
  - symptom: "Arduino Uno resets whenever motors start spinning"
    cause: "Voltage sag or electrical noise caused by lack of common ground or powering Arduino from weak motor batteries."
    remedy: "Power Arduino Uno via USB power bank or fresh 9V battery while using 4xAA exclusively for motors. Ensure GNDs are tied."
extensions:
  - "Implement 3-state PID (Proportional-Integral-Derivative) steering using analogRead() reflectance values."
  - "Add a start/stop countdown button and lap timer displayed over Serial Monitor."
