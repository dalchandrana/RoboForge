id: p3-autonomous-line-follower
title: "Autonomous Dual-Sensor Line-Following Robot"
description: "Assemble a 2-wheel differential-drive mobile robot chassis, wire an L298N motor driver module with dual IR reflectance sensors, and program an autonomous trajectory tracking algorithm."
difficulty: 3
minutes: 90
costUSD:
  min: 25
  max: 35
skills:
  - differential-drive
  - motor-driver-h-bridge
  - ir-reflectance-sensing
  - closed-loop-feedback
kit: starter
simulatedTwin: "robot-2d"
needsHumanVerification: true
verifyChecklist:
  - "Verify dual IR sensors correctly differentiate between black electrical tape and white poster board"
  - "Verify L298N motor driver 12V terminal receives external 6V battery pack (never Arduino 5V)"
  - "Verify Arduino GND and Battery GND are firmly tied together in a common ground reference"
  - "Check that TT motors spin in opposite directions when turning left or right"
safetyRules:
  - "NEVER connect motor power directly to the Arduino Uno 5V or 3.3V header pins. DC motors can draw stall surges up to 800mA, destroying the onboard 5V linear regulator."
  - "Use a 4xAA battery holder (6.0V DC) or a 5V USB power bank. Never exceed 9V DC into yellow TT gearmotors."
  - "Always install an on/off toggle switch in series with the battery pack so you can instantly kill power if the robot runs off the table."
  - "Tie the battery negative (-) lead directly to Arduino GND. Without a shared common ground, control signals will float unpredictably."
