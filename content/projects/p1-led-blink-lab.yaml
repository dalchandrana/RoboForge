      max: 0.5
    alternatives:
      - "5mm Green LED (Vf approx 2.2V)"
      - "5mm Yellow LED (Vf approx 2.1V)"
    notes: "Longer lead is the positive anode (+); shorter lead and flat flat edge is the cathode (-)."
    affiliate: false
  - name: "220Ω 1/4W Resistor"
