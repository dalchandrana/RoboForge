    qty: 1
    spec: "ATmega328P DIP or SMD development board with USB-B cable"
    costUSD:
      min: 4
      max: 8
    alternatives:
      - "Elegoo Uno R3"
      - "SparkFun RedBoard"
      - "Arduino Nano with mini-breadboard"
    notes: "Any 5V ATmega328P board will work identically."
    affiliate: false
  - name: "5mm Diffused LED (Red)"
