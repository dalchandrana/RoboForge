id: p1-led-blink-lab
title: "LED Blink & Timing Lab"
description: "Build your first physical circuit on a breadboard and control an LED with precise millisecond timing code on the Arduino Uno."
difficulty: 1
minutes: 30
costUSD:
  min: 5
  max: 10
skills:
  - breadboard-prototyping
  - digital-output
  - current-limiting
  - arduino-ide
kit: starter
simulatedTwin: "blink"
needsHumanVerification: true
verifyChecklist:
  - "Verify 220 ohm resistor maintains LED current below 20mA"
  - "Verify standard 5mm red LED forward voltage is approximately 1.8V to 2.0V"
  - "Confirm Arduino Uno pin 13 delivers 5V digital HIGH"
safetyRules:
  - "Always disconnect the USB cable before placing or moving wires on the breadboard."
  - "Never connect an LED directly across 5V and GND without a series resistor; doing so causes excess current and permanently burns out the LED."
  - "Operate exclusively from 5V USB bus power. Do not connect mains power or external battery packs for this basic circuit."
bom:
