  - analog-teleoperation
  - mechanical-linkage
  - signal-smoothing-filters
kit: builder
simulatedTwin: "servo-arm"
needsHumanVerification: true
verifyChecklist:
  - "Verify mechanical joint limits: Base rotates 0 to 180 degrees without wire snagging"
  - "Verify shoulder elevation joint does not exceed torque rating of the SG90 (1.8 kg-cm)"
  - "Verify external 5V 2A power rail supplies servos with stable voltage under load"
  - "Confirm exponential moving average (EMA) filter eliminates potentiometer ADC jitter"
safetyRules:
  - "Always power the robotic arm servos from a dedicated external 5V-6V power supply (such as 4xAA battery pack or regulated 5V 2A wall adapter). Powering two servos simultaneously from the Arduino 5V regulator will overheat and fry the regulator."
  - "Keep fingers away from acrylic scissor linkages and servo horn hubs during movement to avoid pinch injuries."
  - "Always connect external power GND and Arduino GND together to maintain a common 0V voltage reference."
