id: p5-servo-robotic-arm
title: "Articulated 2-DOF Robotic Arm"
description: "Construct a 2-degree-of-freedom robotic arm with azimuth (base rotation) and elevation (shoulder lift) axes. Control arm kinematics using dual analog potentiometers with software smoothing."
difficulty: 4
minutes: 120
