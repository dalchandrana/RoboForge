steps:
  - step: 1
    title: "Zero-Calibrate Servos Before Assembly"
    description: "Connect both servos to Arduino, run the servo calibration sketch, and write 90 degrees to both. Mark the center point. NEVER attempt to force-rotate servo gears past their mechanical stops by hand."
    check: "Both servos are electrically locked at their 90-degree midpoint."
  - step: 2
    title: "Assemble the Base Turntable"
    description: "Mount the Base servo into the stationary base plate with the spline pointing up. Screw the rotating upper shoulder bracket directly into the servo horn."
    check: "Upper bracket rotates smoothly across a full 180-degree sweep without binding."
  - step: 3
    title: "Mount the Shoulder Lift Joint"
    description: "Install the Elevation servo horizontally into the rotating bracket. Secure the arm beam to the elevation servo horn at a resting 45-degree angle."
    check: "Arm can swing from parallel to the table (0 deg) to vertical (90 deg)."
  - step: 4
    title: "Wire Potentiometers on Breadboard"
    description: "Place the two 10k potentiometers on the breadboard. Connect their left pins to 5V, right pins to GND, and wipers to Arduino A0 and A1 respectively."
    check: "Wipers swing smoothly between 0V and 5V."
  - step: 5
    title: "Wire External Power and Common Ground"
    description: "Wire external 5V power supply to the breadboard side rail. Connect servo Red wires to external 5V, servo Brown wires to external GND, and link external GND to Arduino GND."
    check: "Common ground confirmed between Arduino and external servo supply."
  - step: 6
    title: "Upload Teleoperation & Filter Sketch"
    description: "Upload the sketch. Rotate Potentiometer 1 to guide the base left and right; rotate Potentiometer 2 to raise and lower the arm beam."
    check: "Arm follows hand movements gracefully without vibration or sudden jerks."
code:
  language: "cpp"
  source: |
    // RoboForge Project 5: Articulated 2-DOF Robotic Arm
    // Teleoperation with Exponential Moving Average (EMA) Jitter Filter

    #include <Servo.h>

    const int PIN_POT_BASE = A0;
    const int PIN_POT_SHOULDER = A1;

    const int PIN_SERVO_BASE = 9;
    const int PIN_SERVO_SHOULDER = 10;

    Servo servoBase;
    Servo servoShoulder;

    // Filtered angle states (floating point for precision)
    float filteredBase = 90.0;
    float filteredShoulder = 90.0;

    // Smoothing coefficient: 0.1 = very smooth/gradual, 0.5 = fast response
    const float ALPHA = 0.15;

    void setup() {
      servoBase.attach(PIN_SERVO_BASE);
      servoShoulder.attach(PIN_SERVO_SHOULDER);

      servoBase.write(90);
      servoShoulder.write(90);
      delay(500);
    }

    void loop() {
      // Read 10-bit raw ADC (0 - 1023)
      int rawBase = analogRead(PIN_POT_BASE);
      int rawShoulder = analogRead(PIN_POT_SHOULDER);

      // Map ADC range to physical servo travel limits (0 to 180 degrees)
      float targetBase = map(rawBase, 0, 1023, 10, 170);
      float targetShoulder = map(rawShoulder, 0, 1023, 20, 160);

      // Apply Exponential Moving Average filter: Y[n] = (1 - alpha)*Y[n-1] + alpha*X[n]
      filteredBase = (1.0 - ALPHA) * filteredBase + ALPHA * targetBase;
      filteredShoulder = (1.0 - ALPHA) * filteredShoulder + ALPHA * targetShoulder;

      // Command servos with filtered integer angles
      servoBase.write((int)filteredBase);
      servoShoulder.write((int)filteredShoulder);

      // Short delay for 50Hz control loop pacing
      delay(20);
    }
  explanation: "Raw ADC readings from carbon track potentiometers suffer from small electrical noise fluctuations. The exponential moving average filter suppresses high-frequency jitter, producing smooth, lifelike cinematic arm movements."
testChecklist:
  - "Turning Potentiometer 1 sweeps base from 10 to 170 degrees."
  - "Turning Potentiometer 2 lifts and lowers the arm smoothly without motor stall chatter."
  - "Releasing the potentiometers leaves the arm held rigidly in position without trembling."
troubleshooting:
  - symptom: "Arm trembles, buzzes, or jitters rapidly when resting in one spot"
    cause: "Electrical noise on the analog potentiometer wires or lack of low-pass filtering."
    remedy: "Reduce the ALPHA constant in code from 0.15 to 0.08 to increase smoothing, or place a 100nF ceramic capacitor between each analog pin (A0, A1) and GND."
  - symptom: "Shoulder servo drops abruptly under its own weight and makes a clicking gear sound"
    cause: "Mechanical arm beam is too long or heavy for 9g plastic gears; torque limit exceeded."
    remedy: "Shorten the arm beam or upgrade the elevation servo to an MG90S metal-gear servo."
  - symptom: "Servos twitch erratically whenever both move at the same time"
    cause: "Power supply is dipping below 4.5V under simultaneous load."
    remedy: "Ensure external supply can supply at least 1.5A to 2.0A at 5V. Add a 470uF electrolytic capacitor across the external power rail."
extensions:
  - "Record & Playback Mode: Press a button to save 5 waypoints in EEPROM, then loop the sequence autonomously."
  - "Inverse Kinematics: Map Cartesian coordinates (X, Y in centimeters) to Joint angles using trigonometry: theta1 = atan2(y, x), theta2 = acos((r^2 - L1^2 - L2^2)/(2*L1*L2))."
