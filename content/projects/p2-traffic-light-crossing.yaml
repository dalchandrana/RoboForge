steps:
  - step: 1
    title: "Setup Ground Rail"
    description: "Plug a black jumper wire from any Arduino GND header into the long blue/black negative (-) power rail on the side of your breadboard."
    check: "Ground rail is now bonded to Arduino reference 0V."
  - step: 2
    title: "Mount the 3 Traffic LEDs"
    description: "Insert the Red LED into rows 4 and 5, Yellow LED into rows 9 and 10, and Green LED into rows 14 and 15. Place the long positive anodes into rows 5, 10, and 15 respectively."
    check: "All short cathode leads are in rows 4, 9, and 14."
  - step: 3
    title: "Connect Current Limiting Resistors & Ground"
    description: "Place three 220 ohm resistors bridging the cathode rows (4, 9, 14) directly into the breadboard Ground rail (-)."
    check: "Every LED cathode has a dedicated path through 220Ω to the ground rail."
  - step: 4
    title: "Insert Pushbutton with Straddle Position"
    description: "Place the 6mm tactile button bridging the center trough (rows 22 and 24). Connect Arduino Pin 2 to row 22, and wire row 24 to the Ground rail (-)."
    check: "Button straddles the center divide with good mechanical grip."
  - step: 5
    title: "Connect Signal Control Jumpers"
    description: "Connect Arduino Pin 12 to row 5 (Red), Pin 11 to row 10 (Yellow), and Pin 10 to row 15 (Green)."
    check: "Red = Pin 12, Yellow = Pin 11, Green = Pin 10, Button = Pin 2."
  - step: 6
    title: "Upload and Test State Sequencing"
    description: "Upload the sketch. Observe the steady Green state. Press the pedestrian button and observe the transition sequence: Green -> Yellow (2s) -> Red (5s) -> Green."
    check: "State changes smoothly and button triggers crosswalk sequence."
code:
  language: "cpp"
  source: |
    // RoboForge Project 2: Pedestrian Crossing & Traffic Light
    // Finite State Machine with Non-Blocking Pushbutton Request

    const int PIN_RED = 12;
    const int PIN_YELLOW = 11;
    const int PIN_GREEN = 10;
    const int PIN_BUTTON = 2;

    enum TrafficState {
      STATE_GREEN,
      STATE_YELLOW,
      STATE_RED_PEDESTRIAN
    };

    TrafficState currentState = STATE_GREEN;
    bool pedestrianRequested = false;
    unsigned long stateStartTime = 0;

    void setLights(bool r, bool y, bool g) {
      digitalWrite(PIN_RED, r ? HIGH : LOW);
      digitalWrite(PIN_YELLOW, y ? HIGH : LOW);
      digitalWrite(PIN_GREEN, g ? HIGH : LOW);
    }

    void setup() {
      pinMode(PIN_RED, OUTPUT);
      pinMode(PIN_YELLOW, OUTPUT);
      pinMode(PIN_GREEN, OUTPUT);

      // Enable internal 20k pull-up resistor: reads HIGH when open, LOW when pressed
      pinMode(PIN_BUTTON, INPUT_PULLUP);

      setLights(false, false, true); // Start with Green
      stateStartTime = millis();
    }

    void loop() {
      // Check for pedestrian request button press (active LOW)
      if (digitalRead(PIN_BUTTON) == LOW) {
        pedestrianRequested = true;
      }

      unsigned long currentDuration = millis() - stateStartTime;

      switch (currentState) {
        case STATE_GREEN:
          // Stay green for at least 5 seconds before honoring pedestrian request
          if (pedestrianRequested && currentDuration >= 5000) {
            currentState = STATE_YELLOW;
            setLights(false, true, false);
            stateStartTime = millis();
          }
          break;

        case STATE_YELLOW:
          // Yellow caution light for 2 seconds
          if (currentDuration >= 2000) {
            currentState = STATE_RED_PEDESTRIAN;
            setLights(true, false, false);
            stateStartTime = millis();
          }
          break;

        case STATE_RED_PEDESTRIAN:
          // Red stop light for vehicles (safe pedestrian crossing) for 5 seconds
          if (currentDuration >= 5000) {
            currentState = STATE_GREEN;
            setLights(false, false, true);
            pedestrianRequested = false;
            stateStartTime = millis();
          }
          break;
      }
    }
  explanation: "Using an enum-based Finite State Machine avoids delay() freezes, ensuring the button click is immediately registered even while waiting in the green state."
testChecklist:
  - "Default resting state is GREEN with Red and Yellow OFF."
  - "Pressing the pedestrian button flags a crossing request."
  - "Traffic light transitions from Green to Yellow for 2000ms, then Red for 5000ms."
  - "After crossing time elapses, system returns cleanly to Green state."
troubleshooting:
  - symptom: "Button press does nothing; light stays green indefinitely"
    cause: "Button not properly connected to ground or plugged into wrong rows on breadboard."
    remedy: "Tactile buttons have 2 internal pairs. Ensure Pin 2 is on one terminal and GND is on the diagonal terminal, or test continuity."
  - symptom: "Traffic light immediately switches to yellow as soon as it turns green"
    cause: "Button is stuck closed, wired to GND continuously, or INPUT_PULLUP not configured in code."
    remedy: "Verify code has pinMode(PIN_BUTTON, INPUT_PULLUP). Remove button wire temporarily to verify if light stays green."
  - symptom: "One of the LEDs (e.g. Yellow) is dim compared to others"
    cause: "Resistor value mismatch (e.g. used 2.2kΩ instead of 220Ω)."
    remedy: "Check color rings on the resistor: Red-Red-Brown is 220Ω, Red-Red-Red is 2.2kΩ."
extensions:
  - "Add a piezo buzzer that beeps slowly during Yellow and rapidly during Red (Walk) for visually impaired pedestrians."
  - "Add a 7-segment display or Serial Monitor countdown timer showing remaining crossing seconds."
