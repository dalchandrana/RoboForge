id: p4-ultrasonic-obstacle-avoider
title: "Obstacle-Avoiding Ultrasonic Smart Car"
description: "Equip your mobile robot with an active pan-scanning ultrasonic radar using an HC-SR04 sonar module and an SG90 micro-servo to map open pathways and navigate rooms autonomously."
difficulty: 3
minutes: 90
costUSD:
  min: 30
  max: 45
skills:
  - ultrasonic-echolocation
  - servo-actuation
  - reactive-navigation
  - pwm-speed-control
kit: builder
simulatedTwin: "robot-2d"
needsHumanVerification: true
verifyChecklist:
  - "Verify HC-SR04 Trigger pulse width meets minimum 10 microsecond requirement"
  - "Verify speed of sound conversion formula: distance_cm = duration_us / 58.2"
  - "Verify SG90 servo rotates smoothly across 0, 90, and 180 degrees without mechanical binding"
  - "Verify external battery pack supplies both L298N and SG90 servo with shared common ground"
safetyRules:
  - "Never power the SG90 servo and L298N motors from the Arduino 5V header. The servo and motors can jointly draw over 1.2A during stalls and turns, causing severe voltage drops and resetting the Arduino."
  - "Operate with a 4xAA battery pack (6V DC nominal). Do not use LiPo batteries without dedicated low-voltage cutoff protection."
  - "Verify clear space around the front servo horn so the sensor does not collide with the chassis during full 180-degree pans."
