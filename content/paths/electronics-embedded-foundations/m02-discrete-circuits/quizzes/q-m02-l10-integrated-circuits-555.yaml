id: q-m02-l10-integrated-circuits-555
items:
  - type: single
    prompt: "How do you identify Pin 1 on a standard DIP-8 integrated circuit chip?"
    choices:
      - text: "Pin 1 is located immediately to the left of the semicircular index notch or marked by an embossed dot"
        correct: true
      - text: "Pin 1 is always the bottom right pin"
        correct: false
      - text: "Chips have no numbered pins"
        correct: false
    explanation: "Looking at the chip with the index notch pointing up, Pin 1 is the top-left corner, and numbering proceeds counter-clockwise around the package."

  - type: single
    prompt: "What does the 555 timer output in astable multivibrator mode?"
    choices:
      - text: "A continuous square-wave oscillation (alternating between HIGH and LOW)"
        correct: true
      - text: "A steady DC voltage with zero change"
        correct: false
      - text: "Radio waves"
        correct: false
    explanation: "Astable mode continuously cycles between charging and discharging the timing capacitor, outputting a regular square-wave pulse."

  - type: single
    prompt: "What determines the blinking rate (frequency) of a 555 astable flasher?"
    choices:
      - text: "The values of timing resistors R1, R2, and capacitor C1"
        correct: true
      - text: "The color of the wires on the breadboard"
        correct: false
      - text: "The ambient air pressure in the room"
        correct: false
    explanation: "The oscillation frequency f = 1.44 / ((R1 + 2*R2) * C1) is set entirely by the passive timing components."
