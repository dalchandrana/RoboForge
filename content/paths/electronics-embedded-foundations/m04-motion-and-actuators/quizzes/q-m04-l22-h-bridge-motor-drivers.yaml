id: q-m04-l22-h-bridge-motor-drivers
items:
  - type: single
    prompt: "In an H-bridge circuit, which switch pairs must be closed to drive the motor in the forward direction?"
    choices:
      - text: "Diagonal pair: High-side Left (S1) and Low-side Right (S4)"
        correct: true
      - text: "Vertical pair: S1 and S2 on the same side"
        correct: false
      - text: "All 4 switches at once"
        correct: false
      - text: "No switches"
        correct: false
    explanation: "Closing diagonal switches directs current from positive supply through the motor to ground in one direction."
  - type: single
    prompt: "What is 'shoot-through' in an H-bridge driver?"
    choices:
      - text: "A destructive direct short-circuit from power supply to ground caused by closing both top and bottom switches on the same leg simultaneously"
        correct: true
      - text: "A laser beam emitted by the motor"
        correct: false
      - text: "When a robot shoots a projectile"
        correct: false
      - text: "A wireless communication failure"
        correct: false
    explanation: "Shoot-through creates a zero-resistance path from +V to GND across the vertical transistor leg, causing instantaneous destruction."
  - type: single
    prompt: "What occurs when both motor leads are shorted together to ground in an active braking state?"
    choices:
      - text: "Back-EMF generated by the spinning rotor opposes rotation, stopping the motor rapidly"
        correct: true
      - text: "The motor spins at infinite speed"
        correct: false
      - text: "The battery catches fire"
        correct: false
      - text: "The motor begins to float"
        correct: false
    explanation: "In active braking, kinetic energy is converted into electrical current that is dissipated in the winding resistance, creating strong dynamic braking torque."
