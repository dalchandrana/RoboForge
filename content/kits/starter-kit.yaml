id: starter-kit
title: "RoboForge Official Starter Kit"
tier: starter
description: "The complete, vendor-neutral hardware bill of materials for Modules 1 through 3 and Projects P1 (LED Blink), P2 (Traffic Light), and P3 (Line Follower Robot)."
targetAudience: "Beginner students (ages 12+) and first-time robotics learners"
estimatedCostUSD:
  min: 32
  max: 42
safetyRating: "Low-voltage DC strictly under 9V and 2A (Class III SELV compliant)"
items:
