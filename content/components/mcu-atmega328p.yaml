absoluteMaxRatings:
  voltage_V: 6
  current_mA: 200
  power_mW: 1000
  tempMax_C: 85
  notes: Absolute maximum DC current per I/O pin is 40 mA (recommended ≤ 20 mA continuous). Total chip current through VCC/GND must not exceed 200 mA!
typicalOperatingConditions:
  voltage_V: 5.0V (or 7-12V on VIN/Barrel Jack)
  current_mA: 45mA (Quiescent Board Draw)
  frequency: 16 MHz
